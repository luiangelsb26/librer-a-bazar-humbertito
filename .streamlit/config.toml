[theme]
base = "light"
font = "sans-serif"
headingFont = "sans-serif"
baseFontSize = 15
headingFontWeights = [700, 700, 650, 650, 600, 600]
baseRadius = "0.75rem"
buttonRadius = "0.5rem"
showWidgetBorder = true
showSidebarBorder = true

[theme.light]
primaryColor = "#2457B4"
linkColor = "#2457B4"
backgroundColor = "#F4F7FB"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#18263D"
borderColor = "#D5DFEC"
dataframeHeaderBackgroundColor = "#E8EFF9"
dataframeBorderColor = "#D5DFEC"
chartCategoricalColors = ["#2457B4", "#087F72", "#7846A8", "#B65B22", "#AD3E5F"]

[theme.light.sidebar]
primaryColor = "#2457B4"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#EFF4FA"
textColor = "#243550"
borderColor = "#D5DFEC"

[theme.dark]
primaryColor = "#654AB3"
linkColor = "#C8B7FF"
backgroundColor = "#11131A"
secondaryBackgroundColor = "#1B1E29"
textColor = "#EDF0FA"
borderColor = "#34394B"
dataframeHeaderBackgroundColor = "#272C3D"
dataframeBorderColor = "#34394B"
chartCategoricalColors = ["#B7A2FF", "#6AD4C2", "#81B8FF", "#F4B07E", "#F591B3"]

[theme.dark.sidebar]
primaryColor = "#654AB3"
backgroundColor = "#171923"
secondaryBackgroundColor = "#222637"
textColor = "#E2E7F6"
borderColor = "#34394B"
