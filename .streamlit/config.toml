[theme]
base = "dark"
primaryColor = "#2F8F83"
backgroundColor = "#101820"
secondaryBackgroundColor = "#18232C"
textColor = "#EAF1F3"
font = "sans-serif"
headingFont = "sans-serif"
baseRadius = "12px"
buttonRadius = "10px"
showWidgetBorder = true
showSidebarBorder = true
dataframeHeaderBackgroundColor = "#222D33"
dataframeBorderColor = "#303C43"
baseFontSize = 15
baseFontWeight = 400
headingFontWeights = [650, 650, 600, 550, 500, 500]
linkUnderline = false
chartCategoricalColors = [
  "#2F8F83",
  "#D45B45",
  "#5B8DEF",
  "#E0A548",
  "#9B7DE0",
  "#54A879",
  "#C96F9D"
]

[theme.sidebar]
backgroundColor = "#141D25"
secondaryBackgroundColor = "#1B2730"
textColor = "#E5ECEF"
primaryColor = "#2F8F83"
borderColor = "#2A3740"

[theme.light]
primaryColor = "#397D74"
backgroundColor = "#F4F6F7"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#29373D"
borderColor = "#DFE5E7"
dataframeHeaderBackgroundColor = "#EEF3F4"
dataframeBorderColor = "#DCE5E8"

[theme.light.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F8FAFB"
textColor = "#39484E"
borderColor = "#DFE5E7"

[theme.dark]
primaryColor = "#4C9387"
backgroundColor = "#11181D"
secondaryBackgroundColor = "#171F24"
textColor = "#E1E8EB"
borderColor = "#2B373D"
dataframeHeaderBackgroundColor = "#222D33"
dataframeBorderColor = "#303C43"

[theme.dark.sidebar]
backgroundColor = "#141C21"
secondaryBackgroundColor = "#1B252B"
textColor = "#DCE4E7"
borderColor = "#2B373D"
